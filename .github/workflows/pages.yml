name: Deploy Download Page (GitHub Pages)

on:
  push:
    branches: [ main ]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish OS Download Portal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish site/ to gh-pages branch
        shell: bash
        run: |
          TMP_SITE="$(mktemp -d)"
          cp -a site/. "${TMP_SITE}/"
          touch "${TMP_SITE}/.nojekyll"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git checkout -B gh-pages origin/gh-pages
          else
            git checkout --orphan gh-pages
          fi

          git rm -rf . >/dev/null 2>&1 || true
          cp -a "${TMP_SITE}/." .
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(pages): update OS download portal"
            git push origin gh-pages
          else
            echo "gh-pages is already up to date."
          fi

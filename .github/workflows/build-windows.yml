name: Build & Smoke Test Windows

on:
  push:
    branches: [ main, 'release/**' ]
  pull_request:
    branches: [ main ]
  workflow_call:
    inputs:
      version:
        required: false
        type: string

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-windows:
    name: Build & Smoke Test Windows (.exe setup & .zip)
    if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Fetch pinned Syncthing v2.1.7
        shell: pwsh
        run: |
          python scripts/fetch_syncthing.py --os windows --arch amd64 --out C:\tools\syncthing-amd64.exe
          python scripts/fetch_syncthing.py --os windows --arch arm64 --out C:\tools\syncthing-arm64.exe

      - name: Build Flutter Windows app
        working-directory: app
        shell: pwsh
        run: |
          if (-not (Test-Path "windows")) {
            flutter create --platforms=windows --org com.tandem --project-name tandem .
          }
          flutter pub get
          $Version = "${{ inputs.version }}"
          if (-not $Version) { $Version = (Get-Content ..\VERSION -Raw).Trim() }
          $Core = ($Version -split "-")[0]
          $Parts = $Core.Split(".")
          $BuildNumber = [int]$Parts[0] * 10000 + [int]$Parts[1] * 100 + [int]$Parts[2]
          flutter build windows --release --build-name="$Core" --build-number="$BuildNumber"

      - name: Package Windows (.exe & .zip)
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $Version = "${{ inputs.version }}"
          if (-not $Version) { $Version = (Get-Content VERSION -Raw).Trim() }
          $OutDir = "${{ github.workspace }}\dist"
          $FlutterBundle = "${{ github.workspace }}\app\build\windows\x64\runner\Release"
          if (-not (Test-Path $FlutterBundle)) {
            $FlutterBundle = "${{ github.workspace }}\app\build\windows\runner\Release"
          }
          & .\scripts\package_windows.ps1 -Version "$Version" -Arch "amd64" -OutDir $OutDir -FlutterBundleDir $FlutterBundle -SyncthingBin "C:\tools\syncthing-amd64.exe"
          & .\scripts\package_windows.ps1 -Version "$Version" -Arch "arm64" -OutDir $OutDir -SyncthingBin "C:\tools\syncthing-arm64.exe"

      - name: Silent-install smoke test, firewall rules & daemon health
        shell: pwsh
        run: |
          $SetupExe = (Get-ChildItem dist\*-windows-amd64-setup.exe | Select-Object -First 1).FullName
          if (-not $SetupExe) { throw "Windows amd64 installer missing" }
          $proc = Start-Process -FilePath $SetupExe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Installer exited with code $($proc.ExitCode)" }
          $InstallDir = "${env:ProgramFiles}\Tandem"
          $InstalledDaemon = Join-Path $InstallDir "tandemd.exe"
          $InstalledSyncthing = Join-Path $InstallDir "syncthing.exe"
          if (-not (Test-Path $InstalledDaemon)) { throw "tandemd.exe missing after silent install" }
          if (-not (Test-Path $InstalledSyncthing)) { throw "syncthing.exe missing after silent install" }
          & $InstalledDaemon -version
          if ($LASTEXITCODE -ne 0) { throw "tandemd.exe -version failed with exit code $LASTEXITCODE" }
          $rules = Get-NetFirewallRule -DisplayName "Tandem*"
          if ($rules.Count -lt 3) { throw "Expected Tandem firewall rules after install" }
          $appFilters = $rules | Get-NetFirewallApplicationFilter
          if (-not ($appFilters | Where-Object { $_.Program -like "*tandemd.exe" })) {
            throw "Expected firewall rules bound to tandemd.exe"
          }
          $CfgDir = Join-Path $env:TEMP "tandem-win-smoke"
          if (Test-Path $CfgDir) { Remove-Item -Recurse -Force $CfgDir }
          New-Item -ItemType Directory -Force -Path $CfgDir | Out-Null
          $Env:PATH = "$InstallDir;$Env:PATH"
          $DaemonProc = Start-Process -FilePath $InstalledDaemon -ArgumentList "-config", $CfgDir, "-bind", "127.0.0.1:18385", "-sync-port", "24200", "-discovery-port", "24127", "-engine-gui", "127.0.0.1:18384", "-device-name", "WinSmoke", "-global-discovery=false", "-relays=false", "-nat=false" -PassThru
          try {
            $Ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              $KeyFile = Join-Path $CfgDir "api.key"
              if (Test-Path $KeyFile) {
                $ApiKey = (Get-Content $KeyFile -Raw).Trim()
                try {
                  $Health = Invoke-RestMethod -Uri "http://127.0.0.1:18385/api/v1/health" -Headers @{ Authorization = "Bearer $ApiKey" } -TimeoutSec 2
                  if ($Health.engineReady) {
                    $Ready = $true
                    break
                  }
                } catch {}
              }
              Start-Sleep -Milliseconds 500
            }
            if (-not $Ready) { throw "Installed Windows daemon failed to become healthy" }
            Write-Host "WINDOWS_INSTALLED_HEALTHY"
          } finally {
            if ($DaemonProc -and -not $DaemonProc.HasExited) {
              Stop-Process -Id $DaemonProc.Id -Force -ErrorAction SilentlyContinue
            }
            Get-Process -Name "syncthing" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-windows
          path: dist/*
          if-no-files-found: error

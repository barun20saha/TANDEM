name: Build & Smoke Test macOS

on:
  push:
    branches: [ main, 'release/**' ]
  pull_request:
    branches: [ main ]
  workflow_call:
    inputs:
      version:
        required: false
        type: string

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-macos:
    name: Build & Smoke Test macOS (.dmg & universal .app)
    if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Report runner architecture
        run: uname -a && arch

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Fetch pinned Syncthing v2.1.7 (darwin universal)
        run: python3 scripts/fetch_syncthing.py --os darwin --arch universal --out /tmp/tools/syncthing

      - name: Build Flutter macOS app
        working-directory: app
        run: |
          if [ ! -d macos ]; then
            flutter create --platforms=macos --org com.tandem --project-name tandem .
          fi
          flutter pub get
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="$(tr -d '[:space:]' < ../VERSION)"; fi
          CORE_VERSION="${VERSION%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${CORE_VERSION}"
          BUILD_NUMBER=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          flutter build macos --release --build-name="${CORE_VERSION}" --build-number="${BUILD_NUMBER}"

      - name: Package macOS Universal Bundle & DMG
        env:
          OUT_DIR: ${{ github.workspace }}/dist
          SYNCTHING_BIN: /tmp/tools/syncthing
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="$(tr -d '[:space:]' < VERSION)"; fi
          export VERSION
          export COMMIT_SHA="$(git rev-parse --short HEAD)"
          export BUILD_DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          RELEASE_DIR="${{ github.workspace }}/app/build/macos/Build/Products/Release"
          FLUTTER_APP_PATH="$(find "$RELEASE_DIR" -maxdepth 1 -name '*.app' | head -n 1 || true)"
          if [ -z "$FLUTTER_APP_PATH" ] || [ ! -d "$FLUTTER_APP_PATH" ]; then
            echo "error: no built .app bundle found under $RELEASE_DIR" >&2
            ls -la "$RELEASE_DIR" || true
            exit 1
          fi
          export FLUTTER_APP_PATH
          chmod +x scripts/package_macos.sh
          bash scripts/package_macos.sh

      - name: Embedded daemon health & Info.plist Local Network check
        run: |
          DMG=$(ls dist/tandem-*-macos-universal.dmg | head -n 1)
          MOUNT_PT="$(hdiutil attach "$DMG" -nobrowse -readonly | awk -F'\t' '/\/Volumes\//{print $NF; exit}')"
          if [ -z "$MOUNT_PT" ] || [ ! -d "$MOUNT_PT/Tandem.app" ]; then
            echo "::error::Failed to mount DMG or locate Tandem.app (MOUNT_PT=$MOUNT_PT)"
            exit 1
          fi
          trap "hdiutil detach \"$MOUNT_PT\" -force || true" EXIT
          ls -la "$MOUNT_PT/Tandem.app/Contents/"
          if ! plutil -p "$MOUNT_PT/Tandem.app/Contents/Info.plist" | grep -F "NSLocalNetworkUsageDescription"; then
            echo "::error::NSLocalNetworkUsageDescription missing from Info.plist"
            exit 1
          fi
          if ! "$MOUNT_PT/Tandem.app/Contents/Helpers/tandemd" -version; then
            echo "::error::Embedded Helpers/tandemd -version failed"
            exit 1
          fi
          if ! "$MOUNT_PT/Tandem.app/Contents/Helpers/syncthing" --version; then
            echo "::error::Embedded Helpers/syncthing --version failed"
            exit 1
          fi

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/*
          if-no-files-found: error

name: Tandem Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.2.0 or 0.3.0-beta.1). Defaults to VERSION file.'
        required: false
        type: string
      prerelease:
        description: 'Mark release as pre-release'
        required: false
        default: false
        type: boolean
      draft:
        description: 'Create as draft release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  prepare:
    name: Prepare Release Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      core_version: ${{ steps.meta.outputs.core_version }}
      build_number: ${{ steps.meta.outputs.build_number }}
      tag: ${{ steps.meta.outputs.tag }}
      channel: ${{ steps.meta.outputs.channel }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      commit: ${{ steps.meta.outputs.commit }}
      build_date: ${{ steps.meta.outputs.build_date }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Version & Channel
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            RAW="${{ inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RAW="${GITHUB_REF#refs/tags/v}"
          else
            RAW="$(tr -d '[:space:]' < VERSION)"
          fi

          VERSION="${RAW#v}"
          TAG="v${VERSION}"
          CORE_VERSION="${VERSION%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${CORE_VERSION}"
          BUILD_NUMBER=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          if [ "${BUILD_NUMBER}" -lt 1 ]; then BUILD_NUMBER=1; fi

          CHANNEL="stable"
          IS_PRERELEASE="false"
          if [[ "${VERSION}" == *-* ]]; then
            PRERELEASE_PART="${VERSION#*-}"
            CHANNEL="${PRERELEASE_PART%%.*}"
            IS_PRERELEASE="true"
          fi
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            IS_PRERELEASE="true"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "core_version=${CORE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_OUTPUT"

  build-linux:
    name: Build Linux (.deb & .tar.gz)
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Desktop Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Flutter Linux App
        working-directory: app
        run: |
          if [ ! -d linux ]; then
            flutter create --platforms=linux --org com.tandem --project-name tandem .
          fi
          flutter pub get
          flutter build linux --release \
            --build-name="${{ needs.prepare.outputs.core_version }}" \
            --build-number="${{ needs.prepare.outputs.build_number }}"

      - name: Package Linux amd64 & arm64
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          COMMIT_SHA: ${{ needs.prepare.outputs.commit }}
          BUILD_DATE: ${{ needs.prepare.outputs.build_date }}
          OUT_DIR: ${{ github.workspace }}/dist
        run: |
          chmod +x scripts/package_deb.sh
          FLUTTER_BUNDLE_DIR="app/build/linux/x64/release/bundle" ARCH=amd64 bash scripts/package_deb.sh
          ARCH=arm64 bash scripts/package_deb.sh

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/*
          if-no-files-found: error

  build-windows:
    name: Build Windows (amd64 & arm64 .zip)
    runs-on: windows-latest
    needs: prepare
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Flutter Windows App
        working-directory: app
        shell: pwsh
        run: |
          if (-not (Test-Path "windows")) {
            flutter create --platforms=windows --org com.tandem --project-name tandem .
          }
          flutter pub get
          flutter build windows --release `
            --build-name="${{ needs.prepare.outputs.core_version }}" `
            --build-number="${{ needs.prepare.outputs.build_number }}"

      - name: Package Windows amd64 & arm64
        shell: pwsh
        run: |
          $OutDir = "${{ github.workspace }}\dist"
          $FlutterBundle = "${{ github.workspace }}\app\build\windows\x64\runner\Release"
          if (-not (Test-Path $FlutterBundle)) {
            $FlutterBundle = "${{ github.workspace }}\app\build\windows\runner\Release"
          }
          & .\scripts\package_windows.ps1 `
            -Version "${{ needs.prepare.outputs.version }}" `
            -Arch "amd64" `
            -Channel "${{ needs.prepare.outputs.channel }}" `
            -OutDir $OutDir `
            -FlutterBundleDir $FlutterBundle
          & .\scripts\package_windows.ps1 `
            -Version "${{ needs.prepare.outputs.version }}" `
            -Arch "arm64" `
            -Channel "${{ needs.prepare.outputs.channel }}" `
            -OutDir $OutDir

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/*
          if-no-files-found: error

  build-macos:
    name: Build macOS (Universal .app & .dmg)
    runs-on: macos-latest
    needs: prepare
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Flutter macOS App
        working-directory: app
        run: |
          if [ ! -d macos ]; then
            flutter create --platforms=macos --org com.tandem --project-name tandem .
          fi
          flutter pub get
          flutter build macos --release \
            --build-name="${{ needs.prepare.outputs.core_version }}" \
            --build-number="${{ needs.prepare.outputs.build_number }}"

      - name: Package macOS Universal Bundle & DMG
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          COMMIT_SHA: ${{ needs.prepare.outputs.commit }}
          BUILD_DATE: ${{ needs.prepare.outputs.build_date }}
          OUT_DIR: ${{ github.workspace }}/dist
          FLUTTER_APP_PATH: ${{ github.workspace }}/app/build/macos/Build/Products/Release/tandem.app
        run: |
          chmod +x scripts/package_macos.sh
          bash scripts/package_macos.sh

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/*
          if-no-files-found: error

  build-android:
    name: Build Android (Sideload APK & Play AAB/APK)
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Package Android Sideload & Play Builds
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          OUT_DIR: ${{ github.workspace }}/dist
        run: |
          chmod +x scripts/package_android.sh
          bash scripts/package_android.sh

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist/*
          if-no-files-found: error

  publish:
    name: Attest & Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare, build-linux, build-windows, build-macos, build-android]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download All Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: dist-*
          merge-multiple: true

      - name: Generate Checksums & Release Manifest
        run: |
          python3 scripts/generate_release_manifest.py \
            --dist-dir release-assets \
            --version "${{ needs.prepare.outputs.version }}" \
            --tag "${{ needs.prepare.outputs.tag }}" \
            --commit "${{ needs.prepare.outputs.commit }}" \
            --channel "${{ needs.prepare.outputs.channel }}"
          ls -lh release-assets

      - name: Generate Build Provenance Attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'release-assets/*'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Tandem ${{ needs.prepare.outputs.tag }}
          draft: ${{ inputs.draft == true }}
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

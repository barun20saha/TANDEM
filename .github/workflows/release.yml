name: Tandem Staged Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.3.0)'
        required: false
        type: string
      stage:
        description: 'Release stage (A=Linux only, B=Desktop, C=All incl Android)'
        required: false
        default: 'A'
        type: choice
        options: [ 'A', 'B', 'C' ]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  prepare:
    name: Resolve Release Version & Stage
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      channel: ${{ steps.meta.outputs.channel }}
      commit: ${{ steps.meta.outputs.commit }}
      stage: ${{ steps.meta.outputs.stage }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        run: |
          RAW="${{ inputs.version }}"
          if [ -z "$RAW" ] && [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RAW="${GITHUB_REF#refs/tags/v}"
          fi
          if [ -z "$RAW" ]; then
            RAW="$(tr -d '[:space:]' < VERSION)"
          fi
          VERSION="${RAW#v}"
          CHANNEL="stable"
          if [[ "$VERSION" == *-* ]]; then CHANNEL="${VERSION#*-}"; CHANNEL="${CHANNEL%%.*}"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "stage=${{ inputs.stage || 'A' }}" >> "$GITHUB_OUTPUT"

  test:
    uses: ./.github/workflows/test.yml

  linux:
    needs: [ prepare, test ]
    uses: ./.github/workflows/build-linux.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  windows:
    if: needs.prepare.outputs.stage == 'B' || needs.prepare.outputs.stage == 'C'
    needs: [ prepare, test ]
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  macos:
    if: needs.prepare.outputs.stage == 'B' || needs.prepare.outputs.stage == 'C'
    needs: [ prepare, test ]
    uses: ./.github/workflows/build-macos.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  android:
    if: needs.prepare.outputs.stage == 'C'
    needs: [ prepare, test ]
    uses: ./.github/workflows/build-android.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  draft-release:
    name: Assemble Checksums & Draft Release
    if: >-
      always() &&
      needs.test.result == 'success' &&
      needs.linux.result == 'success' &&
      (needs.windows.result == 'success' || needs.windows.result == 'skipped') &&
      (needs.macos.result == 'success' || needs.macos.result == 'skipped') &&
      (needs.android.result == 'success' || needs.android.result == 'skipped')
    needs: [ prepare, test, linux, windows, macos, android ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: dist-*
          merge-multiple: true

      - name: Generate SHA256SUMS and manifest
        run: |
          python3 scripts/generate_release_manifest.py \
            --dist-dir release-assets \
            --version "${{ needs.prepare.outputs.version }}" \
            --tag "${{ needs.prepare.outputs.tag }}" \
            --commit "${{ needs.prepare.outputs.commit }}" \
            --channel "${{ needs.prepare.outputs.channel }}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'release-assets/*'

      - name: Create Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Tandem ${{ needs.prepare.outputs.tag }}
          draft: true
          prerelease: true
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

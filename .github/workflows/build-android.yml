name: Build Android (Stage C)

on:
  push:
    branches: [ main, 'release/**' ]
    tags: [ 'v*' ]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        required: false
        type: string

jobs:
  build-android:
    name: Build & Verify Signed Android APK/AAB
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Android NDK
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "build-tools;35.0.0"

      - name: Decode release keystore (non-fork only)
        if: github.event.pull_request.head.repo.fork != true && env.HAS_KEYSTORE == 'true'
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/tandem-release.jks
          cat << EOF > app/android/key.properties
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=/tmp/tandem-release.jks
          EOF

      - name: Package Android Sideload & Play Builds
        env:
          OUT_DIR: ${{ github.workspace }}/dist
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="$(tr -d '[:space:]' < VERSION)"; fi
          export VERSION
          chmod +x scripts/package_android.sh
          bash scripts/package_android.sh

      - name: Clean temporary keystore files
        if: always()
        run: rm -f /tmp/tandem-release.jks app/android/key.properties

      - name: Verify release APK signing (fail if Android Debug)
        if: github.event.pull_request.head.repo.fork != true
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          APKSIGNER=$(ls "${ANDROID_HOME}/build-tools/"*/apksigner | sort -V | tail -n 1)
          for apk in dist/*.apk; do
            "$APKSIGNER" verify --verbose --print-certs "$apk" | tee /tmp/apk-cert.txt
            if grep -q "CN=Android Debug" /tmp/apk-cert.txt; then
              echo "FAIL: $apk is signed with Android Debug key!"
              exit 1
            fi
          done

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist/*
          if-no-files-found: error

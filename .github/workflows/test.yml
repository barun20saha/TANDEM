name: Tandem Test Gate

on:
  push:
    branches: [ main, 'release/**' ]
  pull_request:
    branches: [ main ]
  workflow_call:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-and-e2e:
    name: Go Unit (-race), Contract & WS1 E2E (Linux)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Go vet and unit tests (-race)
        working-directory: core
        env:
          CGO_ENABLED: '1'
        run: |
          go vet ./...
          go build ./...
          go test -race -count=1 ./...

      - name: Run OpenAPI contract & security tests
        working-directory: core
        run: go test -v -count=1 -run 'TestOpenAPIContractAndAuthParity|TestSecurity_' ./api

      - name: Run Chaos suite
        working-directory: tests/chaos
        run: go test -v -count=1 .

      - name: Fetch pinned Syncthing v2.1.7 and run WS1 E2E suite
        run: |
          python3 scripts/fetch_syncthing.py --os linux --arch amd64 --out /tmp/tools/syncthing
          export PATH="/tmp/tools:$PATH"
          cd tests && go test -v -count=1 -timeout 10m ./e2e | tee /tmp/e2e.log

      - name: Upload E2E log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-e2e-log
          path: /tmp/e2e.log

  design-and-fake-guard:
    name: Design Token, Contrast & Fake-Data Guard
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run design & fake-data audit
        run: |
          python3 scripts/bump_version.py
          python3 design/audit.py
          grep -F "Hard-coded color violations outside tokens.dart:" design/AUDIT.md | grep " 0"
          grep -F "Overall Component Completeness Score:" design/AUDIT.md | grep "100.0%"

  flutter-and-live-ui:
    name: Flutter Analyze, Widget Tests & Live Two-Daemon UI
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux desktop & Xvfb dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Fetch pinned Syncthing v2.1.7
        run: python3 scripts/fetch_syncthing.py --os linux --arch amd64 --out /tmp/tools/syncthing

      - name: Run Flutter analyze and full test suite (including live two-daemon UI)
        working-directory: app
        env:
          PATH: /tmp/tools:${{ env.PATH }}
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test --reporter expanded
          xvfb-run -a flutter test -d linux integration_test/app_live_test.dart

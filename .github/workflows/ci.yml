name: Tandem CI

on:
  push:
    branches: [ main, 'release/**' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-matrix:
    name: Core Engine & PAL (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Run Core Test Suite
        working-directory: core
        env:
          CGO_ENABLED: '0'
        run: go test -v ./...

      - name: Run Chaos Test Suite
        if: runner.os == 'Linux'
        working-directory: tests/chaos
        env:
          CGO_ENABLED: '0'
        run: go test -v .

      - name: Fetch Pinned Syncthing & Run E2E Suite (Linux)
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: '0'
        run: |
          python3 scripts/fetch_syncthing.py --os linux --arch amd64 --out /tmp/tools/syncthing
          export PATH="/tmp/tools:$PATH"
          cd tests && go test -v -count=1 -timeout 10m ./e2e

      - name: Build tandemd Binary
        shell: bash
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          EXT=""
          if [ "${{ runner.os }}" = "Windows" ]; then EXT=".exe"; fi
          cd core
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.buildDate=${DATE} -X main.channel=ci" \
            -o "../bin/tandemd_${{ matrix.os }}${EXT}" ./cmd/tandemd

  design-audit:
    name: Design System Token Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Version Sync
        run: python3 scripts/bump_version.py

      - name: Run Design Token Audit
        run: python3 design/audit.py

      - name: Verify Audit Report
        run: |
          grep -F "Hard-coded color violations outside tokens.dart:" design/AUDIT.md | grep " 0"
          grep -F "Overall Component Completeness Score:" design/AUDIT.md | grep "100.0%"

  flutter-app:
    name: Flutter Analyze & Widget Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: app
        run: flutter pub get

      - name: Run Flutter Analyze
        working-directory: app
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee /tmp/flutter_analyze.log || {
            tail -n 60 /tmp/flutter_analyze.log | while IFS= read -r l; do
              echo "::error::$l"
            done
            exit 1
          }

      - name: Run Flutter Widget Tests
        working-directory: app
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee /tmp/flutter_test.log || {
            tail -n 60 /tmp/flutter_test.log | while IFS= read -r l; do
              echo "::error::$l"
            done
            exit 1
          }

  packaging-smoke:
    name: Package Linux Artifacts (amd64 & arm64)
    runs-on: ubuntu-latest
    needs: [core-matrix, design-audit, flutter-app]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Install Packaging Tools
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build Debian, RPM & Tarball Packages
        run: |
          chmod +x scripts/package_deb.sh
          ARCH=amd64 bash scripts/package_deb.sh
          ARCH=arm64 bash scripts/package_deb.sh

      - name: Upload Linux Packages
        uses: actions/upload-artifact@v4
        with:
          name: tandem-linux-ci-packages
          path: |
            bin/*.deb
            bin/*.rpm
            bin/*.tar.gz
          if-no-files-found: error

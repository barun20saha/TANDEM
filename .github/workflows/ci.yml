name: Tandem CI & Release Automation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  core-matrix:
    name: Core Engine & PAL (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run Core Test Suite
        working-directory: core
        env:
          CGO_ENABLED: '0'
        run: go test -v ./...

      - name: Run Chaos Test Suite
        if: runner.os == 'Linux'
        working-directory: tests/chaos
        env:
          CGO_ENABLED: '0'
        run: go test -v .

      - name: Build tandemd Binary
        working-directory: core
        env:
          CGO_ENABLED: '0'
        run: go build -v -o ../bin/tandemd_${{ matrix.os }} ./cmd/tandemd

  design-audit:
    name: Design System Token Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Design Token Audit
        run: python3 design/audit.py

      - name: Verify Audit Report
        run: |
          grep -F "Hard-coded color violations outside tokens.dart:" design/AUDIT.md | grep " 0"
          grep -F "Overall Component Completeness Score:** 100.0%" design/AUDIT.md

  flutter-app:
    name: Flutter App & Widget Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        working-directory: app
        run: flutter pub get

      - name: Run Flutter Widget Tests
        working-directory: app
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee /tmp/test_output.log || {
            while IFS= read -r line; do
              echo "::error::$line"
            done < /tmp/test_output.log
            exit 1
          }

  packaging:
    name: Build Standalone Packages
    runs-on: ubuntu-latest
    needs: [core-matrix, design-audit]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build Debian Package
        run: bash scripts/package_deb.sh

      - name: Upload Debian Package
        uses: actions/upload-artifact@v4
        with:
          name: tandem-debian-package
          path: bin/*.deb
          if-no-files-found: error

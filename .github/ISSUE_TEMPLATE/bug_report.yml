name: Bug Report
description: Report a crash, sync failure, UI issue, or platform-specific bug in Tandem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug in Tandem! Please include your platform and version details below.
  - type: dropdown
    id: platform
    attributes:
      label: Operating System
      multiple: true
      options:
        - Windows 10/11
        - macOS
        - Linux
        - Android
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tandem Version
      description: Output of `tandemd -version` or app Settings version
      placeholder: "e.g., 0.2.0 (linux/amd64)"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the unexpected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or diagnostics
      description: Paste `tandemd` logs or `GET /api/v1/health` output (redact any API keys).
      render: shell

name: Feature Request
description: Propose a new capability, platform enhancement, or UX improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Core Daemon / Sync Engine
        - Platform Adapter (Windows / macOS / Linux / Android)
        - Flutter UI / Design System
        - Packaging / CI / Release
        - Documentation
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: How should this work across platforms?
    validations:
      required: true
